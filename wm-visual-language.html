<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WM Visual Language 1 — Wanderhaym</title><meta name="description" content="Official visual signature grammar for Wanderhaym WM contact cards."><meta name="robots" content="index,follow"></head><body><main><h1>WM Visual Language 1</h1><p>A WM contact signature has the form <code>WM-XNNN SHAPE SIGIL RANK</code>.</p><p>Resolver pages define how a signature is converted to a contact key. The card image must be used as the source of the visible signature.</p><p><a href="/wm-protocol.html">WM Protocol 1</a></p></main></body></html>
